<!DOCTYPE html>
<html>
<head>
  <title>Chores</title>
</head>
<body>
  <h1>Chores</h1>
  {% if not chores %}
    <p>No chores yet.</p>
  {% else %}
    <ul>
      {% for chore in chores %}
        <li>
          {{ chore.name }} &mdash; {{ chore.get_cadence_display }} &mdash; {{ chore.current_holder.name }}
          {% if chore.is_overdue %}<span class="overdue-flag" style="color: #b00; font-weight: bold;">&#9888; Overdue</span>{% endif %}
        </li>
      {% endfor %}
    </ul>
  {% endif %}
</body>
</html>
